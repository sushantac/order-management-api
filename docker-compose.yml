# ============================================================================
# PR #2 - local infrastructure. PR #28 adds Redis for the application cache.
# ----------------------------------------------------------------------------
# PostgreSQL 16 for local development; Redis 7 as the distributed cache used
# by the @Cacheable product catalogue (profile: dev, or SPRING_CACHE_TYPE=redis).
#
# DEV ONLY credentials - real environments inject secrets via GitOps/secrets
# managers, never via docker-compose.
# ============================================================================
services:
  postgres:
    image: postgres:16
    container_name: order-api-postgres
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
    ports:
      # host:container - change the left side if 5432 is already in use.
      - "5432:5432"
    volumes:
      # Named volume (NOT a bind mount) so data survives restarts while staying
      # out of the git repo.
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready lets docker compose wait until Postgres actually accepts
      # connections before the API starts (depends_on + condition later PRs).
      test: ["CMD-SHELL", "pg_isready -U order -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # PR #28 - Redis 7 for the application-level product cache. AOF persistence
  # keeps cached values across container restarts (learning setup; real caches
  # are loss-tolerant and usually run without it).
  redis:
    image: redis:7-alpine
    container_name: order-api-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - order-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  order-postgres-data:
  order-redis-data:
