# ============================================================================
# PR #2 - local infrastructure. PR #28 adds Redis for the application cache.
# ----------------------------------------------------------------------------
# PostgreSQL 16 for local development; Redis 7 as the distributed cache used
# by the @Cacheable product catalogue (profile: dev, or SPRING_CACHE_TYPE=redis).
#
# DEV ONLY credentials - real environments inject secrets via GitOps/secrets
# managers, never via docker-compose.
# ============================================================================
services:
  postgres:
    image: postgres:16
    container_name: order-api-postgres
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
    ports:
      # host:container - change the left side if 5432 is already in use.
      - "5432:5432"
    volumes:
      # Named volume (NOT a bind mount) so data survives restarts while staying
      # out of the git repo.
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready lets docker compose wait until Postgres actually accepts
      # connections before the API starts (depends_on + condition later PRs).
      test: ["CMD-SHELL", "pg_isready -U order -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # PR #28 - Redis 7 for the application-level product cache. AOF persistence
  # keeps cached values across container restarts (learning setup; real caches
  # are loss-tolerant and usually run without it).
  redis:
    image: redis:7-alpine
    container_name: order-api-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - order-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # PR #31 - Kafka (single-node KRaft, no ZooKeeper) for the order-event bus.
  # Topics are auto-created; the outbox publisher and consumer only activate
  # when app.kafka.enabled=true (dev/prod profiles).
  kafka:
    # PR #31 - single-node KRaft for the order-event bus.
    image: apache/kafka:3.7.0
    container_name: order-api-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # PR #32 - Jaeger all-in-one (trace collector + UI). The API exports OTLP
  # traces when management.tracing.enabled=true; UI at http://localhost:16686.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: order-api-jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # PR #33 - the API itself, built from the multi-stage Dockerfile. It joins
  # the compose network so the other services resolve by name (postgres/redis/
  # kafka/jaeger) - exactly what the dev profile expects.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-management-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  order-postgres-data:
  order-redis-data:
