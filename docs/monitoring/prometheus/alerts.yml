# PR #32 - AlertManager rules for the order-management-api SLOs.
# Scrape: Prometheus -> /actuator/prometheus; rules evaluate the 5m burn rate.
groups:
  - name: order-api-slo
    rules:
      - alert: OrderPlacementLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(order_place_seconds_bucket[5m])) by (le)) > 1.0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Order placement p95 over 1s for 5m"
      - alert: OrderPlacementFailures
        expr: |
          (sum(rate(order_place_seconds_count{exception="none"}[5m]))
            / sum(rate(order_place_seconds_count[5m]))) < 0.99
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Order placement success rate below 99% (5m)"
      - alert: Api5xxRatioHigh
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count[5m])) > 0.001
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx ratio above 0.1% (5m)"
