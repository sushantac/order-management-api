# ============================================================================
# PR #14 - DEV profile: let Hibernate auto-update the schema for experiments.
# ----------------------------------------------------------------------------
# USE WITH CARE. 'update' only ADDS what Hibernate knows about - it never drops
# stale columns/tables, and it can fight Liquibase (the schema source of truth).
# Ideal for throwaway local databases; NEVER for shared/prod environments.
# Tests and CI intentionally run the DEFAULT profile (ddl-auto: validate).
# ============================================================================
spring:
  jpa:
    hibernate:
      ddl-auto: update

  # PR #28 - dev runs the real distributed cache (docker-compose: redis service).
  cache:
    type: redis
    redis:
      # TTL: cached products expire after 10 minutes (cache-aside misses then
      # re-populate from the DB). Short enough to bound staleness, long enough
      # to absorb the read-heavy catalogue traffic.
      time-to-live: 10m
      key-prefix: orderapi:
      cache-null-values: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  kafka:
    # PR #31 - dev talks to the docker-compose Kafka broker.
    enabled: true
