# ============================================================================
# RAG profile: enables document ingestion + DeepSeek answer generation.
# Prerequisites:
#   1. Ollama running locally (brew install ollama && ollama serve)
#   2. Ollama embedding model pulled (ollama pull nomic-embed-text)
#   3. DEEPSEEK_API_KEY environment variable set
# Usage:
#   ./mvnw spring-boot:run -Dspring-boot.run.arguments=--spring.profiles.active=rag
# ============================================================================
spring:
  ai:
    # PR #44 - EXPLICIT model selection. DeepSeek answers, Ollama embeds.
    # Without this, DeepSeekChatAutoConfiguration and OllamaChatAutoConfiguration
    # both register a ChatModel and the app fails at startup with "required a
    # single bean, but 2 were found".
    model:
      chat: deepseek
      embedding: ollama
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY env var}
    ollama:
      embedding:
        model: nomic-embed-text

app:
  rag:
    enabled: true
    docs-location: classpath:docs/**/*.md
    chunk-size: 800
    chunk-overlap: 200
    top-k: 5
    # PR #42 - vectors live in PostgreSQL via the pgvector extension.
    # embedding-dimensions must match the embedding model (nomic-embed-text = 768).
    embedding-dimensions: 768
    vector-table: vector_store
    # PR #43 - retrieval strategy: DENSE (embeddings only) or HYBRID (dense +
    # Postgres full-text fused via Reciprocal Rank Fusion, then MMR re-rank).
    # RETRIEVAL-MODE IS A WIRING DECISION: dense is the measured baseline,
    # hybrid the default.
    retrieval-mode: hybrid
    # Hybrid tuning. PR #44 flipped mmr-enabled to OFF: on this corpus MMR at
    # 0.5 dropped hit-rate@5 from 75% to 50% (single-topic goldens) while RRF
    # alone held 75% and raised top-1 accuracy to 50%. Optional tuning block
    # (all values are the shipped defaults - only override what you measured):
    # retrieval:
    #   mmr-enabled: false
    #   mmr-lambda: 0.5
    #   rrf-k: 60
    # Retrieval-eval harness (PR #42, made real in PR #44): gate is EARNED from
    # measured numbers (see docs/additions/07-hybrid-retrieval.md#measured).
    # min-hit-rate=0.7 sits just under the measured hit-rate@5 of 75% so a real
    # retrieval regression fails startup loudly. Every run writes an audit
    # snapshot to report-location (build artifact, git-ignored).
    eval:
      enabled: true
      goldens-location: classpath:rag/eval/golden-questions.json
      min-hit-rate: 0.7
      report-location: target/rag-eval-report.json