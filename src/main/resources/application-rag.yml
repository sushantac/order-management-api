# ============================================================================
# RAG profile: enables document ingestion + DeepSeek answer generation.
# Prerequisites:
#   1. Ollama running locally (brew install ollama && ollama serve)
#   2. Ollama embedding model pulled (ollama pull nomic-embed-text)
#   3. DEEPSEEK_API_KEY environment variable set
# Usage:
#   ./mvnw spring-boot:run -Dspring-boot.run.arguments=--spring.profiles.active=rag
# ============================================================================
spring:
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY env var}
    ollama:
      embedding:
        model: nomic-embed-text

app:
  rag:
    enabled: true
    docs-location: classpath:docs/**/*.md
    chunk-size: 800
    chunk-overlap: 200
    top-k: 5
    # PR #42 - vectors live in PostgreSQL via the pgvector extension.
    # embedding-dimensions must match the embedding model (nomic-embed-text = 768).
    embedding-dimensions: 768
    vector-table: vector_store
    # PR #43 - retrieval strategy: DENSE (embeddings only) or HYBRID (dense +
    # Postgres full-text fused via Reciprocal Rank Fusion, then MMR re-rank).
    # RETRIEVAL-MODE IS A WIRING DECISION: the code base treats dense as the
    # baseline and hybrid as the default.
    retrieval-mode: hybrid
    # Hybrid tuning. rrf-k=60 is the canonical RRF constant. mmr-lambda=1 keeps
    # pure relevance order; lower trades relevance for topical diversity (0.5 is
    # the typical starting point for multi-part questions).
    # retrieval:
    #   mmr-enabled: true
    #   mmr-lambda: 0.5
    #   rrf-k: 60
    # Retrieval-eval harness (PR #42): report-only by default. Set min-hit-rate
    # (e.g. 0.7) to gate startup on measured retrieval quality.
    # eval:
    #   enabled: true
    #   goldens-location: classpath:rag/eval/golden-questions.json
    #   min-hit-rate: 0.7