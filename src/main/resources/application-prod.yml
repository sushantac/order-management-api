# ============================================================================
# PR #14 - PROD profile: the schema is ALWAYS owned by Liquibase.
# ----------------------------------------------------------------------------
# 'validate' makes Hibernate compare entity metadata against the real database
# at startup and FAIL the application on any mismatch - drift can never ship
# silently. 'update' is forbidden here because a production outage caused by a
# surprise DDL is not acceptable.
# ============================================================================
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    # PR #15 - SQL/log noise is a dev feature; production stays quiet (and
    # statistics collection adds overhead).
    show-sql: false
    properties:
      hibernate:
        generate_statistics: false

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.stat: WARN

# PR #28 - production caches product reads in the shared Redis (infra-provided,
# secrets via GitOps). Same TTL as dev; set SPRING_CACHE_TYPE=simple to disable.
spring:
  cache:
    type: redis
    redis:
      time-to-live: 10m
      key-prefix: orderapi:
      cache-null-values: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

app:
  kafka:
    # PR #31 - production publishes order events to the provisioned Kafka.
    enabled: true

management:
  # PR #32 - production ships traces to the OTLP/Jaeger collector.
  tracing:
    enabled: true
  otlp:
    metrics:
      export:
        interval: 10s
