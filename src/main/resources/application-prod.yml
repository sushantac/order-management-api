# ============================================================================
# PR #14 - PROD profile: the schema is ALWAYS owned by Liquibase.
# ----------------------------------------------------------------------------
# 'validate' makes Hibernate compare entity metadata against the real database
# at startup and FAIL the application on any mismatch - drift can never ship
# silently. 'update' is forbidden here because a production outage caused by a
# surprise DDL is not acceptable.
# ============================================================================
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    # PR #15 - SQL/log noise is a dev feature; production stays quiet (and
    # statistics collection adds overhead).
    show-sql: false
    properties:
      hibernate:
        generate_statistics: false

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.stat: WARN
