spring:
  application:
    name: order-management-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:ecommerce}?currentSchema=orders
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:secret}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: orders

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: order-api
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.company.orderapi.messaging,com.ecommerce.*"

  security:
    oauth2:
      resourceserver:
        jwt:
          secret: ${JWT_SECRET:dev-secret-change-me-please-at-least-32chars-long-123}

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8084
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
    probes:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

app:
  internal:
    api-key: ${INTERNAL_API_KEY:internal-service-key-12345}
  kafka:
    topics:
      cart-checkout: cart.checkout.initiated
      order-placed: order.placed
      order-status-changed: order.status.changed
      legacy-order-events: order-events
