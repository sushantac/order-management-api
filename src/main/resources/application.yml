# ============================================================================
# PR #2 - Database wiring (PostgreSQL + Liquibase).
# ----------------------------------------------------------------------------
# PR #1 deliberately excluded DB auto-configuration. PR #2 introduces the real
# schema and therefore removes those exclusions:
#   - docker-compose.yml runs PostgreSQL 16 locally.
#   - Liquibase owns the schema (db/changelog/db.changelog-master.xml);
#     Hibernate never creates or updates it (ddl-auto: validate).
# Every value is overridable via environment variables so the same file works
# for local dev (docker-compose), integration tests (Testcontainers) and CI.
# ============================================================================
spring:
  application:
    name: order-management-api

  # --- PostgreSQL connection (dev defaults match docker-compose.yml) --------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orderdb}
    username: ${DB_USER:order}
    password: ${DB_PASSWORD:order}
    hikari:
      pool-name: OrderApiHikariPool
      maximum-pool-size: 10

  # --- Schema versioning with Liquibase --------------------------------------
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  jpa:
    open-in-view: false
    # PR #15 - show every JPA query in the logs (see logging levels below).
    show-sql: true
    hibernate:
      # Liquibase owns the schema. 'validate' only confirms the JPA entities
      # match the DB - it never modifies anything.
      ddl-auto: validate
    properties:
      hibernate:
        # Pretty-print the SQL so it is actually readable.
        format_sql: true
        # PR #15 - comment each statement with the code path that generated it.
        use_sql_comments: true
        # PR #15 - session/query statistics (also used by the tests).
        generate_statistics: true
        # PR #7 - batch fetching knobs.
        # default_batch_fetch_size: when a lazy collection/many-to-one IS loaded,
        # Hibernate loads up to this many owners in ONE "in (...)" query instead
        # of firing one query per owner (kills most N+1 without any JPQL).
        default_batch_fetch_size: 20
        # jdbc.fetch_size: rows streamed from the DB per round-trip (ResultSet
        # fetch size). Helps large result sets, independent of batch fetching.
        jdbc:
          fetch_size: 100
        # PR #16 - second-level cache (JCache + Ehcache). Only entities marked
        # @Cacheable (selective mode) are cached.
        cache:
          use_second_level_cache: true
          region:
            factory_class: jcache
        jakarta.persistence.sharedCache.mode: ENABLE_SELECTIVE

  # --- PR #28: application-level cache ----------------------------------------
  # Default = 'simple' (ConcurrentHashMap): zero-infrastructure caching for the
  # unit/integration test contexts. Redis is the real store and is activated by
  # the dev/prod profiles (or SPRING_CACHE_TYPE=redis) - see those files.
  cache:
    type: simple

server:
  # SERVER_PORT env var overridable - useful for tests / running multiple instances.
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      # Detailed health is handy in dev; restrict before production (later PR).
      show-details: always

logging:
  level:
    root: INFO
    # Our own classes log at DEBUG during the learning journey.
    com.company.orderapi: DEBUG
    # PR #15 - SQL debugging: statement + pretty print, parameter bindings,
    # and session statistics. See application-prod.yml (all disabled there).
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.stat: DEBUG

# --- PR #26: security -------------------------------------------------------
app:
  security:
    # Master switch (kept off by non-security integration tests).
    enabled: true
    # HS256 signing secret for the LEARNING journey (>= 32 chars). Production
    # validates against the authorization server's published JWK set instead.
    jwt-secret: local-learning-secret-change-me-please-32chars
    # Simple API-key fallback for scripts/machine clients (PR #26).
    api-key: dev-api-key-orderapi
    cors:
      allowed-origins:
        - http://localhost:3000
