apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-management-api
  annotations:
    # PR #33 - cert-manager issues/proxies a TLS certificate automatically.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.example.com
      secretName: order-api-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: order-management-api
                port:
                  number: 80
