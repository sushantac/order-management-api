# PR #34 - ArgoCD Application: one per environment (name/environment below is
# a placeholder the per-env repo/app set replaces).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-management-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sushantac/order-management-api
    targetRevision: develop
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: order-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
