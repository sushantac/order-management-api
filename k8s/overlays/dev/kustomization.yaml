apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namePrefix: dev-
commonLabels:
  env: dev
configMapGenerator:
  - name: order-api-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_NAME=orderdb
replicas:
  - name: order-management-api
    count: 1
images:
  - name: ghcr.io/sushantac/order-management-api
    newTag: develop
