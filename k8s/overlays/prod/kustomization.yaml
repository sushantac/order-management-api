apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namePrefix: prod-
commonLabels:
  env: prod
configMapGenerator:
  - name: order-api-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_NAME=orderdb
replicas:
  - name: order-management-api
    count: 3
images:
  - name: ghcr.io/sushantac/order-management-api
    newTag: prod
